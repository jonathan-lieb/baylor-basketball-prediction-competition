<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Baylor Predictions</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <main class="auth-page">

        <div class="card">

            <h1>Baylor Predictions</h1>

            <h2>Log In</h2>

            <form id="login-form">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >


                <button type="submit" class="button">
                    Log In
                </button>

            </form>


            <p id="message"></p>


            <p class="auth-link">

                Don't have an account?

                <a href="signup.html">
                    Sign up
                </a>

            </p>

        </div>

    </main>


    <!-- Supabase library -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/config.js"></script>

    <script src="js/auth.js"></script>

</body>

</html>
