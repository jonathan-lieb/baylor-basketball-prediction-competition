<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Predictions | Baylor Predictions</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <header class="site-header">

        <div>
            <h1>Baylor Predictions</h1>
            <p id="welcome-message"></p>
        </div>

        <button id="logout-button" class="button">
            Log Out
        </button>

    </header>


    <main class="page-container">

        <section class="card">

            <h2>My Predictions</h2>

            <p>
                Enter Baylor's probability of winning each game.
                You can change your prediction until you lock it
                or the game begins.
            </p>

            <div id="predictions-container">

                <p>Loading games...</p>

            </div>

        </section>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/config.js"></script>

    <script src="js/predictions.js"></script>

</body>

</html>
