<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | Baylor Predictions</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <main class="auth-page">

        <div class="card">

            <h1>Baylor Predictions</h1>

            <h2>Create Account</h2>


            <form id="signup-form">

                <label for="display-name">
                    Display Name
                </label>

                <input
                    type="text"
                    id="display-name"
                    maxlength="50"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    minlength="6"
                    required
                >


                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    minlength="6"
                    required
                >


                <button type="submit" class="button">
                    Create Account
                </button>

            </form>


            <p id="message"></p>


            <p class="auth-link">

                Already have an account?

                <a href="login.html">
                    Log in
                </a>

            </p>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/config.js"></script>

    <script src="js/auth.js"></script>

</body>

</html>
